name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: TowerScanner + اتصال v1.0
          body: |
            ماسح أبراج مع قسم اتصال:
            - حفظ رقم والاتصال به لمدة بالثواني بعد الرد.
            - تثبيت برج للاتصال عليه فقط، وفصل عند مغادرة البرج وإعادة اتصال عند العودة.
            - إجابة واردة من الرقم نفسه بنفس شرط البرج.
            ملاحظة: إنهاء المكالمات أو الرد عليها برمجياً يتطلب تعيين التطبيق كتطبيق الهاتف الافتراضي.
          files: app/build/outputs/apk/debug/app-debug.apk
